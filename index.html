<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pässe-Ranking Dolomiten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4E9EE; --surface:#FFFFFF; --ink:#1A2531; --muted:#5C6A78; --line:#C9D2DB;
  --plate:#6B4226; --plate-ink:#FFFFFF;
  --fun:#E8A900; --amb:#C94F83; --seg:#DCE2E8;
  --cond:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#18212B; --surface:#222D39; --ink:#E9EEF2; --muted:#9AA8B5; --line:#34414F;
    --plate:#7A4C2C; --seg:#34414F; --fun:#F2BC1B; --amb:#E06A9D;
  }
}
:root[data-theme="dark"]{
  --bg:#18212B; --surface:#222D39; --ink:#E9EEF2; --muted:#9AA8B5; --line:#34414F;
  --plate:#7A4C2C; --seg:#34414F; --fun:#F2BC1B; --amb:#E06A9D;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:28px 16px 64px}

header h1{font:700 clamp(2.6rem,9vw,4rem)/0.95 var(--cond);letter-spacing:-0.01em;margin:0}
header p{margin:.5rem 0 0;color:var(--muted);max-width:44ch}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:24px 0 18px}
.seg-ctl{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg-ctl button{border:0;background:none;padding:.45rem .95rem;border-radius:999px;font:600 1rem var(--cond);color:var(--muted)}
.seg-ctl button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.count{font:500 .95rem var(--cond);color:var(--muted)}

.list{display:flex;flex-direction:column;gap:14px;padding:0;margin:0;list-style:none}
.pass{display:grid;grid-template-columns:44px 1fr;gap:12px;background:var(--surface);border-radius:14px;padding:14px 14px 16px 10px;border:1px solid var(--line)}
.rank{font:700 2rem/1 var(--cond);text-align:center;padding-top:6px;color:var(--muted)}
.pass.top .rank{color:var(--ink)}
.plate{background:var(--plate);color:var(--plate-ink);border-radius:8px;padding:4px}
.plate-in{border:2px solid var(--plate-ink);border-radius:5px;padding:8px 12px 9px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline}
.plate h2{font:700 1.7rem/1.05 var(--cond);margin:0;letter-spacing:.005em}
.alt{font:600 1.15rem var(--cond);white-space:nowrap}
.intl{grid-column:1/-1;font:500 1.05rem/1.2 var(--cond);opacity:.92}
.intl span{opacity:.75}
.region{margin:8px 2px 0;font-size:.9rem;color:var(--muted)}

.ratings{margin-top:12px;display:grid;gap:8px}
.rate{display:grid;grid-template-columns:78px 1fr 44px;align-items:center;gap:8px}
.rate label{font:600 .98rem var(--cond)}
.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.dots button{height:26px;border:0;border-radius:4px;background:var(--seg);padding:0}
.rate.fun .dots button.on{background:var(--fun)}
.rate.amb .dots button.on{background:var(--amb)}
.dots button:hover{filter:brightness(.93)}
.val{font:700 1.25rem var(--cond);text-align:right}
.val.none{color:var(--muted);font-weight:500}

.photos{display:flex;gap:8px;overflow-x:auto;margin-top:14px;padding-bottom:2px;scroll-snap-type:x proximity}
.photos img,.add-photo{flex:0 0 auto;width:112px;height:84px;border-radius:8px;object-fit:cover;scroll-snap-align:start}
.photos img{cursor:zoom-in;background:var(--seg)}
.add-photo{border:2px dashed var(--line);background:none;color:var(--muted);font:600 .95rem/1.15 var(--cond);display:flex;align-items:center;justify-content:center;text-align:center;padding:6px}
.add-photo.busy{opacity:.6;pointer-events:none}

.note{margin-top:12px;width:100%;min-height:2.6em;resize:vertical;border:1px solid var(--line);border-radius:8px;background:transparent;padding:.5rem .65rem;font-size:.95rem}
.foot{display:flex;justify-content:flex-end;margin-top:6px}
.link{border:0;background:none;color:var(--muted);font:500 .9rem var(--body);text-decoration:underline;text-underline-offset:3px;padding:4px}

.add-pass{margin-top:18px;width:100%;border:2px dashed var(--line);background:none;border-radius:14px;padding:16px;font:600 1.15rem var(--cond);color:var(--muted)}
.empty,.notice{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;color:var(--muted)}

dialog{border:0;border-radius:14px;padding:0;background:var(--surface);color:var(--ink);max-width:min(460px,calc(100vw - 24px));width:100%}
dialog::backdrop{background:rgba(10,16,22,.6)}
.form{padding:20px;display:grid;gap:12px}
.form h3{font:700 1.6rem var(--cond);margin:0}
.form label{display:grid;gap:4px;font:600 .95rem var(--cond)}
.form input{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:.55rem .65rem;font:400 1rem var(--body)}
.row{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:6px}
.btn{border:0;border-radius:999px;padding:.6rem 1.2rem;font:600 1.05rem var(--cond);background:var(--ink);color:var(--bg)}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:#C23B3B;border:1px solid currentColor}

#lightbox{max-width:min(1100px,calc(100vw - 16px));background:#0E1419;color:#fff}
#lightbox img{display:block;width:100%;max-height:78vh;object-fit:contain}
#lightbox .row{padding:10px 12px;margin:0}
#lightbox .btn.ghost{color:#fff;border-color:#4A5663}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:10px;font-size:.95rem;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
@media (max-width:420px){
  .pass{grid-template-columns:30px 1fr;gap:8px;padding-left:6px}
  .rank{font-size:1.6rem}
  .rate{grid-template-columns:66px 1fr 36px;gap:6px}
  .plate h2{font-size:1.5rem}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Pässe&shy;ranking</h1>
    <p>Dolomiten und Südtirol, bewertet nach Fahrspaß und Ambiente. Tippe auf die Balken, um von 1 bis 10 zu bewerten.</p>
  </header>
  <div class="bar">
    <div class="seg-ctl" role="group" aria-label="Sortieren nach">
      <button data-sort="total" aria-pressed="true">Gesamt</button>
      <button data-sort="fun" aria-pressed="false">Fahrspaß</button>
      <button data-sort="amb" aria-pressed="false">Ambiente</button>
    </div>
    <span class="count" id="count"></span>
  </div>
  <ol class="list" id="list"><li class="notice">Lade Pässe …</li></ol>
  <button class="add-pass" id="addPass" hidden>+ Pass hinzufügen</button>
</div>

<dialog id="editDlg">
  <form class="form" id="editForm" method="dialog">
    <h3 id="editTitle">Pass hinzufügen</h3>
    <label>Name deutsch<input name="de" required placeholder="z. B. Falzaregopass"></label>
    <label>Internationaler / italienischer Name<input name="intl" placeholder="z. B. Passo di Falzarego"></label>
    <label>Ladinischer Name (optional)<input name="lad" placeholder="z. B. Ju de Falzares"></label>
    <label>Höhe in Metern<input name="alt" type="number" inputmode="numeric" min="0" max="5000"></label>
    <label>Strecke / Region<input name="region" placeholder="z. B. Cortina – Arabba"></label>
    <div class="row">
      <button type="button" class="btn danger" id="delPass" hidden>Pass löschen</button>
      <span style="flex:1"></span>
      <button type="button" class="btn ghost" id="cancelEdit">Abbrechen</button>
      <button type="submit" class="btn">Speichern</button>
    </div>
  </form>
</dialog>

<dialog id="lightbox">
  <img id="lbImg" alt="">
  <div class="row">
    <button class="btn ghost" id="lbDel" hidden>Foto entfernen</button>
    <span style="flex:1"></span>
    <button class="btn ghost" id="lbClose">Schließen</button>
  </div>
</dialog>

<input type="file" id="fileIn" accept="image/*" multiple hidden>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  let db = null, assets = null, passes = [], sortKey = 'total', canWrite = true;
  let pendingRender = false, uploadFor = null, editId = null, lb = null;
  const queues = {};
  const $ = s => document.querySelector(s);
  const list = $('#list');

  function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }
  function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function score(p, key){
    if(key==='fun') return p.fun ?? null;
    if(key==='amb') return p.amb ?? null;
    const v=[p.fun,p.amb].filter(x=>typeof x==='number');
    return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null;
  }
  function fmt(v){ return v==null ? '–' : (Math.round(v*10)/10).toString().replace('.',','); }

  function write(id, patch){
    const p = passes.find(x=>x.id===id); if(p) Object.assign(p, patch);
    render();
    queues[id] = (queues[id]||Promise.resolve())
      .then(()=>db.doc('passes/'+id).update(patch))
      .catch(e=>{ toast(e && e.code==='invalid_argument' ? 'Du hast hier keine Schreibrechte.' : 'Speichern fehlgeschlagen. Bitte nochmal versuchen.'); });
  }

  function render(){
    if(document.activeElement && document.activeElement.classList.contains('note')){ pendingRender = true; return; }
    pendingRender = false;
    const sorted = passes.slice().sort((a,b)=>{
      const sa=score(a,sortKey), sb=score(b,sortKey);
      if(sa==null && sb==null) return (a.order??0)-(b.order??0);
      if(sa==null) return 1; if(sb==null) return -1;
      if(sb!==sa) return sb-sa;
      const ta=score(a,'total')??0, tb=score(b,'total')??0;
      return tb-ta || (a.order??0)-(b.order??0);
    });
    $('#count').textContent = passes.length === 1 ? '1 Pass gefahren' : passes.length + ' Pässe gefahren';
    if(!sorted.length){ list.innerHTML = '<li class="empty">Noch keine Pässe eingetragen. Füge unten euren ersten Pass hinzu.</li>'; return; }
    let rank = 0, last = undefined;
    list.innerHTML = sorted.map((p,i)=>{
      const s = score(p,sortKey);
      if(s!==last){ rank = i+1; last = s; }
      const rankTxt = s==null ? '–' : rank;
      const intl = [p.intl ? esc(p.intl) : '', p.lad ? '<span>'+esc(p.lad)+'</span>' : ''].filter(Boolean).join(' / ');
      const photos = (p.photos||[]).map(id=>`<img src="/_blob/${esc(id)}" alt="Foto vom ${esc(p.de)}" loading="lazy" data-photo="${esc(id)}" data-pass="${p.id}">`).join('');
      return `<li class="pass${s!=null && rank<=3 ? ' top':''}" data-id="${p.id}">
        <div class="rank" aria-label="Platz ${rankTxt}">${rankTxt}</div>
        <div>
          <div class="plate"><div class="plate-in">
            <h2>${esc(p.de)}</h2>${p.alt ? `<span class="alt">${esc(p.alt)} m</span>`:'<span></span>'}
            ${intl ? `<div class="intl">${intl}</div>`:''}
          </div></div>
          ${p.region ? `<p class="region">${esc(p.region)}</p>`:''}
          <div class="ratings">
            ${rateRow(p,'fun','Fahrspaß')}
            ${rateRow(p,'amb','Ambiente')}
          </div>
          <div class="photos">${photos}${assets && canWrite ? `<button class="add-photo" data-upload="${p.id}">+ Fotos</button>`:''}</div>
          <textarea class="note" data-note="${p.id}" rows="2" placeholder="Notiz: Straßenzustand, Verkehr, Einkehr …" ${canWrite?'':'readonly'}>${esc(p.note)}</textarea>
          ${canWrite ? `<div class="foot"><button class="link" data-edit="${p.id}">Namen und Daten bearbeiten</button></div>`:''}
        </div>
      </li>`;
    }).join('');
  }
  function rateRow(p,key,label){
    const v = p[key];
    let dots=''; for(let n=1;n<=10;n++) dots += `<button data-rate="${key}" data-n="${n}" data-pass="${p.id}" class="${v!=null && n<=v?'on':''}" aria-label="${label} ${n} von 10" ${canWrite?'':'disabled'}></button>`;
    return `<div class="rate ${key}"><label>${label}</label><div class="dots">${dots}</div><span class="val${v==null?' none':''}">${v==null?'–':v}</span></div>`;
  }

  // Events
  document.querySelectorAll('.seg-ctl button').forEach(b=>b.addEventListener('click',()=>{
    sortKey=b.dataset.sort;
    document.querySelectorAll('.seg-ctl button').forEach(x=>x.setAttribute('aria-pressed', x===b));
    render();
  }));
  list.addEventListener('click', e=>{
    const t = e.target.closest('button,img'); if(!t) return;
    if(t.dataset.rate){
      const p = passes.find(x=>x.id===t.dataset.pass); const n=+t.dataset.n;
      write(p.id, {[t.dataset.rate]: p[t.dataset.rate]===n ? null : n});
    } else if(t.dataset.upload){ uploadFor = t.dataset.upload; $('#fileIn').click(); }
    else if(t.dataset.edit){ openEdit(t.dataset.edit); }
    else if(t.dataset.photo){ lb = {pass:t.dataset.pass, id:t.dataset.photo}; $('#lbImg').src = t.src; $('#lbImg').alt = t.alt; $('#lbDel').hidden = !(assets && canWrite); $('#lightbox').showModal(); }
  });
  list.addEventListener('focusout', e=>{
    if(e.target.dataset && e.target.dataset.note){
      const id=e.target.dataset.note, val=e.target.value, p=passes.find(x=>x.id===id);
      setTimeout(()=>{ if(p && (p.note||'')!==val) write(id,{note:val}); else if(pendingRender) render(); },0);
    }
  });

  async function shrink(file){
    try{
      const bmp = await createImageBitmap(file);
      const max = 1800, k = Math.min(1, max/Math.max(bmp.width,bmp.height));
      const c = document.createElement('canvas'); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
      c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
      const blob = await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));
      return blob || file;
    }catch(_){ return file; }
  }
  $('#fileIn').addEventListener('change', async e=>{
    const files=[...e.target.files]; e.target.value=''; const id=uploadFor; if(!files.length||!id) return;
    const btn = list.querySelector(`[data-upload="${id}"]`); if(btn){ btn.classList.add('busy'); btn.textContent='Lädt …'; }
    const added=[];
    for(const f of files){
      try{
        const blob = await shrink(f);
        const res = await assets.upload(blob, blob.type ? undefined : {type:'image/jpeg'});
        added.push(res.id);
      }catch(err){ toast('Ein Foto konnte nicht hochgeladen werden' + (err && err.code ? ' ('+err.code+')' : '') + '.'); }
    }
    if(added.length){ const p=passes.find(x=>x.id===id); write(id,{photos:[...(p.photos||[]),...added]}); toast(added.length===1?'Foto hinzugefügt':added.length+' Fotos hinzugefügt'); }
    else render();
  });
  $('#lbClose').onclick = ()=>$('#lightbox').close();
  $('#lightbox').addEventListener('click', e=>{ if(e.target.id==='lightbox') $('#lightbox').close(); });
  $('#lbDel').onclick = async ()=>{
    if(!lb || !confirm('Dieses Foto entfernen?')) return;
    const p = passes.find(x=>x.id===lb.pass); const id = lb.id;
    write(p.id,{photos:(p.photos||[]).filter(x=>x!==id)});
    $('#lightbox').close();
    try{ await assets.delete(id); }catch(_){}
    toast('Foto entfernt');
  };

  function openEdit(id){
    editId = id; const f=$('#editForm'); f.reset();
    const p = id ? passes.find(x=>x.id===id) : null;
    $('#editTitle').textContent = p ? 'Pass bearbeiten' : 'Pass hinzufügen';
    $('#delPass').hidden = !p;
    if(p){ f.de.value=p.de||''; f.intl.value=p.intl||''; f.lad.value=p.lad||''; f.alt.value=p.alt||''; f.region.value=p.region||''; }
    $('#editDlg').showModal();
  }
  $('#addPass').onclick = ()=>openEdit(null);
  $('#cancelEdit').onclick = ()=>$('#editDlg').close();
  $('#editForm').addEventListener('submit', async e=>{
    e.preventDefault(); const f=e.target;
    const data = { de:f.de.value.trim(), intl:f.intl.value.trim(), lad:f.lad.value.trim(), alt:f.alt.value?+f.alt.value:null, region:f.region.value.trim() };
    if(!data.de) return;
    $('#editDlg').close();
    if(editId){ write(editId, data); toast('Gespeichert'); }
    else{
      const order = passes.reduce((m,p)=>Math.max(m,p.order??0),0)+1;
      try{ await db.collection('passes').add({...data, fun:null, amb:null, note:'', photos:[], order}); toast(data.de+' hinzugefügt'); }
      catch(err){ toast(err && err.code==='quota_exceeded' ? 'Speicher voll, bitte einen Pass löschen.' : 'Hinzufügen fehlgeschlagen.'); }
    }
  });
  $('#delPass').onclick = async ()=>{
    const p = passes.find(x=>x.id===editId); if(!p || !confirm(p.de+' mit allen Bewertungen und Fotos löschen?')) return;
    $('#editDlg').close();
    try{
      await db.doc('passes/'+p.id).delete();
      if(assets) for(const id of (p.photos||[])) { try{ await assets.delete(id); }catch(_){} }
      toast(p.de+' gelöscht');
    }catch(_){ toast('Löschen fehlgeschlagen.'); }
  };

  // Boot
  (async ()=>{
    if(!window.claude || !window.claude.use){ list.innerHTML='<li class="notice">Diese Seite speichert ihre Daten in Claude. Öffne sie über den Claude-Link.</li>'; return; }
    db = await window.claude.use('db');
    if(!db){ list.innerHTML='<li class="notice">Der Speicher ist in dieser Ansicht nicht verfügbar. Öffne die Seite über den Claude-Link.</li>'; return; }
    assets = await window.claude.use('assets');
    $('#addPass').hidden = false;
    db.collection('passes').onSnapshot(snap=>{
      passes = snap.docs.map(d=>({id:d.id, ...d.data()}));
      render();
    }, err=>{
      if(err.code==='revoked'){ canWrite=false; render(); }
      else list.innerHTML='<li class="notice">Pässe konnten nicht geladen werden. Lade die Seite neu.</li>';
    });
    window.claude.use('user').then(u=>{
      if(!u) return;
      const w = u.can && u.can('data.write');
      Promise.resolve(w).then(v=>{ if(v===false){ canWrite=false; $('#addPass').hidden=true; render(); } });
    });
  })();
})();
</script>
</body>
</html>
